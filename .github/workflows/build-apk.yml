name: Build NetBand APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.dart'
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: netband-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Verify toolchain
        run: |
          flutter --version
          dart --version
          dart --version | grep -E 'Dart SDK version: 3\.(1[0-9]|[2-9][0-9])\.'

      - name: Complete Flutter Android scaffolding
        run: flutter create --platforms=android --project-name netband --org com.netband .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netband-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
