name: Build NetBand APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.dart'
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: netband-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      # The supplied source archive intentionally excludes generated SDK paths and
      # build caches. Generate any missing standard Flutter Android wrapper files
      # without asking Flutter to overwrite the custom Kotlin/Gradle files.
      - name: Complete Flutter Android scaffolding
        run: flutter create --platforms=android --project-name netband --org com.netband .

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: netband-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
